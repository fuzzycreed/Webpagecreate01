<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetCheck — Connection, Browser &amp; DNS Checks</title>
<meta name="description" content="Check your IP address, browser details, fingerprint, WebRTC leaks, DNS propagation, and IP / domain registration in one place.">
<script>
// 保存済みのテーマがあれば、描画の前に反映する（標準テーマが一瞬見えるのを防ぐ）
try { document.documentElement.dataset.theme = localStorage.getItem('netcheck-theme') || 'mono'; } catch (e) { document.documentElement.dataset.theme = 'mono'; }
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 画面の文言は app.js の I18N から入る（data-i18n がキー）。ここに書いてある英語は読み込み前の初期表示。 -->
<div class="page">
<header class="top">
  <div class="marquee retro-only" aria-hidden="true"><span data-t="marquee"></span></div>
  <div class="title-row" id="title-row">
    <div class="lang-pick" id="lang-pick">
      <label>Lang
        <select id="lang-select">
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ru">Русский</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>
    <a class="brand" href="#ip">NetCheck</a>
    <div class="tagline" data-t="tagline">Connection · Browser · DNS diagnostics</div>
    <div class="theme-pick" id="theme-pick" hidden>
      <label><span data-i18n="theme.label">Theme:</span>
        <select id="theme-select">
          <option value="mono" data-i18n="theme.mono">White / Gray (default)</option>
          <option value="jp" data-i18n="theme.jp">🇯🇵 Japan (2000s)</option>
          <option value="us" data-i18n="theme.us">🇺🇸 USA (1990s)</option>
          <option value="ru" data-i18n="theme.ru">🇷🇺 Russia (2000s)</option>
          <option value="cn" data-i18n="theme.cn">🇨🇳 China (modern)</option>
        </select>
      </label>
    </div>
  </div>
  <p id="peek" class="peek retro-only" hidden><b class="blink" data-t="peekLabel"></b> <span id="peek-text"></span></p>
  <select class="tab-select" data-i18n-aria="tabs.aria" aria-label="Tools">
    <option value="ip" data-i18n="tab.ip">IP &amp; Connection</option>
    <option value="browser" data-i18n="tab.browser">Browser</option>
    <option value="fp" data-i18n="tab.fp">Fingerprint</option>
    <option value="webrtc" data-i18n="tab.webrtc">WebRTC</option>
    <option value="dns" data-i18n="tab.dns">DNS Propagation</option>
    <option value="lookup" data-i18n="tab.lookup">IP / Domain Lookup</option>
    <option value="ports" data-i18n="tab.ports">Port Check</option>
    <option value="http" data-i18n="tab.http">HTTP Headers</option>
    <option value="certs" data-i18n="tab.certs">Certificates</option>
  </select>
</header>
<div class="kouji" aria-hidden="true"></div>

<div class="layout">
  <nav class="tabs" role="tablist" data-i18n-aria="tabs.aria" aria-label="Tools">
    <button role="tab" data-tab="ip" data-i18n="tab.ip">IP &amp; Connection</button>
    <button role="tab" data-tab="browser" data-i18n="tab.browser">Browser</button>
    <button role="tab" data-tab="fp" data-i18n="tab.fp">Fingerprint</button>
    <button role="tab" data-tab="webrtc" data-i18n="tab.webrtc">WebRTC</button>
    <button role="tab" data-tab="dns" data-i18n="tab.dns">DNS Propagation</button>
    <button role="tab" data-tab="lookup" data-i18n="tab.lookup">IP / Domain Lookup</button>
    <button role="tab" data-tab="ports" data-i18n="tab.ports">Port Check</button>
    <button role="tab" data-tab="http" data-i18n="tab.http">HTTP Headers</button>
    <button role="tab" data-tab="certs" data-i18n="tab.certs">Certificates</button>
  </nav>
<main>
  <section data-panel="ip" hidden>
    <h1 data-i18n="h.ip">IP &amp; Connection</h1>
    <p class="lead" data-i18n="lead.ip"></p>
    <div id="ip-hero" class="hero"></div>
    <div id="ip-body"></div>
  </section>

  <section data-panel="browser" hidden>
    <h1 data-i18n="h.browser">Browser</h1>
    <p class="lead" data-i18n="lead.browser"></p>
    <div id="browser-body"></div>
  </section>

  <section data-panel="fp" hidden>
    <h1 data-i18n="h.fp">Fingerprint</h1>
    <p class="lead" data-i18n="lead.fp"></p>
    <div id="fp-hero" class="hero"></div>
    <div id="fp-body"></div>
  </section>

  <section data-panel="webrtc" hidden>
    <h1 data-i18n="h.webrtc">WebRTC Leak Test</h1>
    <p class="lead" data-i18n="lead.webrtc"></p>
    <p><button id="webrtc-run" class="btn" data-i18n="webrtc.rerun">Run again</button></p>
    <div id="webrtc-body"></div>
  </section>

  <section data-panel="dns" hidden>
    <h1 data-i18n="h.dns">DNS Propagation Check</h1>
    <p class="lead" data-i18n="lead.dns"></p>
    <form id="dns-form" class="dns-form">
      <input id="dns-name" type="text" placeholder="example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required data-i18n-aria="dns.nameAria" aria-label="Domain name">
      <select id="dns-type" data-i18n-aria="dns.typeAria" aria-label="Record type">
        <option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option>
        <option>NS</option><option>TXT</option><option>SOA</option><option>CAA</option>
        <option>SRV</option><option>PTR</option>
      </select>
      <button class="btn primary" type="submit" data-i18n="go">Check</button>
      <details class="dns-adv">
        <summary data-i18n="dns.adv">Add a region</summary>
        <label><span data-i18n="dns.ecsLabel">Client subnet (IPv4)</span>
          <input id="dns-ecs" type="text" placeholder="203.0.113.0/24" autocomplete="off" inputmode="decimal">
        </label>
      </details>
    </form>
    <div id="dns-body"></div>
  </section>

  <section data-panel="lookup" hidden>
    <h1 data-i18n="h.lookup">IP / Domain Lookup</h1>
    <p class="lead" data-i18n="lead.lookup"></p>
    <form id="lookup-form" class="search-form">
      <input id="lookup-q" type="text" data-i18n-ph="lookup.ph" placeholder="8.8.8.8 or example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required data-i18n-aria="lookup.aria" aria-label="IP address or domain name">
      <button class="btn primary" type="submit" data-i18n="go">Check</button>
    </form>
    <div id="lookup-hero" class="hero"></div>
    <div id="lookup-body"></div>
  </section>

  <section data-panel="ports" hidden>
    <h1 data-i18n="h.ports">Open Port Check</h1>
    <p class="lead" data-i18n="lead.ports"></p>
    <form id="ports-form" class="ports-form">
      <input id="ports-host" type="text" data-i18n-ph="ports.hostPh" placeholder="IP address or hostname" autocomplete="off" autocapitalize="off" spellcheck="false" required data-i18n-aria="ports.hostAria" aria-label="Host">
      <input id="ports-list" type="text" value="21, 22, 23, 53, 80, 443, 3306, 3389, 8080, 8443" autocomplete="off" inputmode="numeric" required data-i18n-aria="ports.portsAria" aria-label="Ports, separated by commas">
      <button class="btn primary" type="submit" data-i18n="go">Check</button>
      <button class="btn" type="button" id="ports-mine" data-i18n="ports.useMine">Use my IP</button>
    </form>
    <div id="ports-body"></div>
  </section>

  <section data-panel="http" hidden>
    <h1 data-i18n="h.http">HTTP Header Check</h1>
    <p class="lead" data-i18n="lead.http"></p>
    <form id="http-form" class="search-form">
      <input id="http-q" type="text" placeholder="https://example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required data-i18n-aria="http.aria" aria-label="URL">
      <button class="btn primary" type="submit" data-i18n="go">Check</button>
    </form>
    <div id="http-hero" class="hero"></div>
    <div id="http-body"></div>
  </section>

  <section data-panel="certs" hidden>
    <h1 data-i18n="h.certs">Certificate History</h1>
    <p class="lead" data-i18n="lead.certs"></p>
    <form id="certs-form" class="search-form">
      <input id="certs-q" type="text" placeholder="example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required data-i18n-aria="certs.aria" aria-label="Domain name">
      <button class="btn primary" type="submit" data-i18n="go">Check</button>
    </form>
    <div id="certs-hero" class="hero"></div>
    <div id="certs-body"></div>
  </section>
</main>
</div>

<div class="kouji" aria-hidden="true"></div>
<footer class="foot">
  <p class="retro-only"><span data-t="counterPre"></span> <span id="counter" class="counter"></span> <span data-t="counterPost"></span></p>
  <p id="kiriban" class="kiriban retro-only" hidden data-t="kiriban"></p>
  <p class="retro-only link-free"><span class="banner">NetCheck</span> <span data-t="linkFree"></span></p>
  <p class="retro-only" data-t="bestViewed"></p>
  <p class="honest retro-only" data-i18n="foot.honestRetro"></p>
  <p class="honest mono-only" data-i18n="foot.honest"></p>
  <p data-t="copyright">© 2026 NetCheck</p>
</footer>
</div>

<!-- 中国（現代）テーマ専用の飾り。どのボタンも押すと「冗談です」と出るだけで、何も起きない -->
<div class="cn-float cn-only">
  <button type="button" data-joke>客服</button>
  <button type="button" data-joke>红包</button>
  <button type="button" data-joke>APP</button>
</div>
<div class="cn-bar cn-only" id="cn-bar">
  <span>🎁 恭喜！您已被选为今日幸运访客！（开玩笑的，什么奖品都没有）</span>
  <button type="button" id="cn-bar-close" aria-label="Close">×</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
