<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124">
  <!-- ソ連風（スターリン時代）テーマの飾り：金の楕円の額に入った、口ひげとパイプの似顔絵（戯画） -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".35" stop-color="#e2b93b"/>
      <stop offset=".6" stop-color="#9c7414"/>
      <stop offset="1" stop-color="#f1cf62"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#c0262b"/>
      <stop offset="1" stop-color="#4e0a0d"/>
    </radialGradient>
    <clipPath id="inner"><ellipse cx="50" cy="62" rx="41" ry="53"/></clipPath>
  </defs>
  <ellipse cx="50" cy="62" rx="48" ry="60" fill="url(#gold)"/>
  <ellipse cx="50" cy="62" rx="44" ry="56" fill="none" stroke="#7a5a10" stroke-width="1"/>
  <ellipse cx="50" cy="62" rx="41" ry="53" fill="url(#bg)"/>
  <g clip-path="url(#inner)">
    <!-- 光の筋 -->
    <g stroke="#f1cf62" stroke-opacity=".18" stroke-width="3">
      <path d="M50 58 L10 0 M50 58 L30 -4 M50 58 L50 -4 M50 58 L70 -4 M50 58 L90 0 M50 58 L0 30 M50 58 L100 30"/>
    </g>
    <!-- 詰襟の上着と、胸の金の星 -->
    <path d="M6 124 C9 99 25 91 38 88 L62 88 C75 91 91 99 94 124 Z" fill="#9a8f63"/>
    <path d="M50 92 L50 124" stroke="#7d7349" stroke-width="1"/>
    <circle cx="50" cy="99" r="1.5" fill="#e2b93b"/>
    <circle cx="50" cy="108" r="1.5" fill="#e2b93b"/>
    <circle cx="50" cy="117" r="1.5" fill="#e2b93b"/>
    <path d="M28 101 h12 v7 h-12 Z M60 101 h12 v7 h-12 Z" fill="none" stroke="#7d7349" stroke-width="1"/>
    <path d="M66 93.2 l1.1 2.3 2.5.3 -1.85 1.75 .48 2.5 -2.23-1.2 -2.23 1.2 .48-2.5 -1.85-1.75 2.5-.3 Z" fill="#f1cf62" stroke="#9c7414" stroke-width=".3"/>
    <rect x="43" y="72" width="14" height="13" fill="#d6ae86"/>
    <path d="M37 88 L40 79 L60 79 L63 88 L50 91 Z" fill="#8a7f55"/>
    <!-- 顔 -->
    <ellipse cx="35.5" cy="57" rx="2.6" ry="4.2" fill="#d6ae86"/>
    <ellipse cx="64.5" cy="57" rx="2.6" ry="4.2" fill="#d6ae86"/>
    <ellipse cx="50" cy="56" rx="15" ry="19" fill="#e6c49e"/>
    <path d="M35.5 52 C34 35 44 29.5 51 30 C60 30 67 36 64.5 52 C62 44 56.5 40.5 50 40.5 C43.5 40.5 38 44 35.5 52 Z" fill="#4d4842"/>
    <path d="M39 45.5 C43 38.5 52 35.5 61 41 M41.5 42 C45 36.5 52.5 34 59 37.5 M37.6 49 C42 42.5 53 40.5 63 46.5" stroke="#6e685f" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M40.5 49.8 Q44 47.6 47.2 49.6 M52.8 49.6 Q56 47.6 59.5 49.8" stroke="#3a332e" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M42 53.6 Q44 52.4 46 53.6 M54 53.6 Q56 52.4 58 53.6" stroke="#2a1a12" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M50.3 53 L48.6 60 Q50 61.2 51.6 60.2" stroke="#b88f6a" stroke-width=".9" fill="none" stroke-linecap="round"/>
    <!-- 立派な口ひげ -->
    <path d="M38.2 65.2 C41 60.2 46.5 59.8 50 62 C53.5 59.8 59 60.2 61.8 65.2 C62.6 67 60.6 68 58.4 66.9 C55.4 65.6 53.2 65.6 50 66.6 C46.8 65.6 44.6 65.6 41.6 66.9 C39.4 68 37.4 67 38.2 65.2 Z" fill="#3a332e"/>
    <!-- パイプと煙 -->
    <path d="M55.5 67.5 Q62 70.5 67.5 71" stroke="#24160d" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <path d="M66 63.6 L74.4 63.6 L73.4 73.6 Q70.2 77 67 73.6 Z" fill="#5e3b1c"/>
    <ellipse cx="70.2" cy="63.6" rx="4.2" ry="1.3" fill="#24160d"/>
    <path d="M70.5 61.5 C67.5 57.5 73.5 54.5 70.5 50.5 C67.5 46.5 73.5 43.5 70.5 39.5" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 額の下の札 -->
  <rect x="33" y="111" width="34" height="10" rx="1" fill="url(#gold)" stroke="#7a5a10" stroke-width=".6"/>
  <text x="50" y="118.6" text-anchor="middle" font-family="Times New Roman, serif" font-size="7" font-weight="700" fill="#5c0d10">И. В. С.</text>
</svg>
